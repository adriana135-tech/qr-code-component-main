<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outifit:wght@400;700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body {
      background-color: #d5e1ef;
      font-family: 'Outifit', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    main {
      background-color: white;
      width: 100%;
      max-width: 320px;
      border-radius: 20px;
      padding: 16px;
      box-sizing: border-box;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
      
    img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }
    h1 {
      font-size: 22px;
      margin: 24px 0 16px;
      font-weight: 700;
    }
    p {
      font-size: 15px;
      margin: 0 16px 24px;
      font-weight: 400;
      line-height: 1.4;
    }
    
  </style>
</head>
<body>
  <main>
    <img src="images/image-qr-code.png" alt="Código QR de Frontend Mentor">

  <h1>Improve your front-end skills by building projects</h1>

  <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
</main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Adri</a>.
  </footer>
</body>
</html>
